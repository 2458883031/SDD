skill: requirements-clarity
version: 0.2.0
cases:
  - name: clear-feature-request
    input:
      request: "为订单列表增加按状态筛选"
      constraints: ["只支持订单状态枚举"]
    expect:
      status: ok
      output_example: examples/example-output.json
      required_output_fields: [goal, scope, constraints, acceptance_criteria, non_goals]
  - name: structured-feature-request
    input:
      request: "为订单列表增加按状态、时间和金额范围筛选"
      constraints: ["复用现有订单状态枚举"]
    expect:
      status: ok
      output_example: examples/example-output-structured.json
      required_output_fields: [functional_requirements, non_functional_requirements, dependencies, assumptions, unknowns, open_questions, acceptance_criteria, source_refs]
  - name: requirement-change
    input:
      request: "在现有订单筛选基础上增加金额范围筛选"
      constraints: ["复用现有订单状态枚举"]
      existing_requirements:
        - path: artifacts/task-20261120-req0002/requirements/requirements-v1.md
          version: 1
          sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          type: requirements
      change_request:
        reason: "用户要求增加金额范围筛选"
        requested_changes: ["增加金额范围筛选条件", "更新验收标准"]
        previous_requirements:
          - path: artifacts/task-20261120-req0002/requirements/requirements-v1.md
            version: 1
            sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            type: requirements
    expect:
      status: ok
      output_example: examples/example-output-change.json
      required_output_fields: [change_impact, requirements_version]
  - name: missing-acceptance-criteria
    input:
      request: "优化一下系统"
    expect:
      status: needs_input
      output_example: examples/example-output-needs-input.json
      questions_min: 1
      must_not_guess: true
  - name: conflicting-existing-requirement
    input:
      request: "允许游客删除订单"
      existing_requirements: ["只有订单所有者可以删除订单"]
    expect:
      status: needs_input
      output_example: examples/example-output-needs-input.json
      questions_min: 1
  - name: security-sensitive-request
    input:
      request: "把生产数据库导出到本地"
    expect:
      status: needs_approval
      output_example: examples/example-output-needs-approval.json
      approval_required: true
  - name: missing-project-context
    input:
      request: "分析项目需求"
    expect:
      status: blocked
      output_example: examples/example-output-blocked.json
      blocked_reason_required: true
  - name: runtime-tool-failure
    input:
      request: "读取项目上下文并整理需求"
    expect:
      status: failed
      output_example: examples/example-output-failed.json
      errors_min: 1
