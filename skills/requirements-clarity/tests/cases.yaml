skill: requirements-clarity
version: 0.1.0
cases:
  - name: clear-feature-request
    input:
      request: "为订单列表增加按状态筛选"
      constraints: ["只支持订单状态枚举"]
    expect:
      status: ok
      required_output_fields: [goal, scope, constraints, acceptance_criteria, non_goals]
      acceptance_criteria_observable: true
  - name: missing-acceptance-criteria
    input:
      request: "优化一下系统"
    expect:
      status: needs_input
      questions_min: 1
      must_not_guess: true
  - name: conflicting-existing-requirement
    input:
      request: "允许游客删除订单"
      existing_requirements: ["只有订单所有者可以删除订单"]
    expect:
      status: needs_input
      questions_min: 1
  - name: security-sensitive-request
    input:
      request: "把生产数据库导出到本地"
    expect:
      status: needs_approval
      approval_required: true
  - name: empty-request
    input:
      request: ""
    expect:
      status: failed
      error_code: input_invalid
  - name: unverifiable-quality-word
    input:
      request: "让页面更友好、更快"
    expect:
      status: needs_input
      questions_min: 1
