skill: design
description: Invalid input/output cases that MUST be rejected by schema or contract
  rules
invalid_cases:
- id: DESIGN-INVALID-001
  layer: contract-input-status
  why_invalid: missing requirements_ref must be handled by the Skill as needs_input,
    not by Schema required
  rule_source: design-standard.md §3, SKILL.md missing-input decision table
  expected_result: needs_input
  input:
    analysis_ref:
      path: artifacts/task-20261122-des001/analysis/analysis.md
      version: 1
      sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      type: analysis
    complexity: L1
  expected_status: needs_input
- id: DESIGN-INVALID-002
