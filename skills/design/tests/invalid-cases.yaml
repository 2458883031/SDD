      path: artifacts/task-20261122-des001/requirements/requirements.md
      version: 1
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      type: requirements
    complexity: L1
  expected_status: needs_input
