schema_version: 1
platform: openclaw
adapter_version: "0.1"
skills:
  requirements-clarity:
    discovery:
      roots:
        - workspace/skills
        - workspace/.agents/skills
    trigger:
      mode: description_match
      aliases: []
      auto_invoke: true
    requirements:
      bins: []
      env: []
      config: []
    invocation:
      mode: native
      tools: [read, write]
    approval:
      mode: platform
    context:
      base_dir_token: "{baseDir}"
    limitations:
      - "P1-001 reference only; SDD Skill semantics not yet verified in OpenClaw."
